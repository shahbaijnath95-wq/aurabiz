# docker-compose.yml — AI WhatsApp Assistant (Multi-Tenant)
# Usage:
#   Development:  docker compose up
#   Production:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # ─── PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: whatsapp_assistant
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─── Qdrant (Vector DB for Knowledge Base / Memory) ─────────
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─── Master Backend (Super Admin API, port 8010) ────────────
  master:
    build:
      context: ./master
      dockerfile: Dockerfile
    ports:
      - "8010:8010"
    env_file:
      - .env.docker
    environment:
      - MASTER_DB_URL=sqlite+aiosqlite:///./data/master.db
      - MASTER_PORT=8010
    volumes:
      - master_data:/app/data
    restart: unless-stopped

  # ─── Backend (FastAPI, port 8000) ────────────────────────────
  backend:
    build:
      context: ./backend
      target: production
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/whatsapp_assistant
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=qdrant
      - QDRANT_PORT=6333
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
      - backend_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      master:
        condition: service_started
    restart: unless-stopped

  # ─── Frontend (Next.js, port 3001) ──────────────────────────
  frontend:
    build:
      context: ./frontend
      target: production
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_MASTER_URL=http://localhost:8010
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  # ─── Admin Frontend (Next.js, port 3002) ───────────────────
  admin-frontend:
    build:
      context: ./admin-frontend
      target: production
    ports:
      - "3002:3000"
    environment:
      - NEXT_PUBLIC_MASTER_API_URL=http://localhost:8010
    depends_on:
      master:
        condition: service_started
    restart: unless-stopped

  # ─── WhatsApp Bot (Baileys, port 8001) ─────────────────────
  whatsapp-bot:
    build:
      context: ./whatsapp-bot
      target: production
    ports:
      - "8001:8001"
    env_file:
      - .env.docker
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - bot_auth:/app/auth_state
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  master_data:
  backend_uploads:
  backend_logs:
  backend_data:
  bot_auth:
